version: '3.8'

networks:
  frontend-net:
  backend-net:
  monitoring-net:

services:
  # 1. Web App & DB (Yêu cầu 2)
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: SecurePassword123!
      POSTGRES_DB: project_db
    networks:
      - backend-net

  app:
    build: ./app
    container_name: pm_app
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: SecurePassword123!
      POSTGRES_DB: project_db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-development-session-secret}
    networks:
      - backend-net
      - frontend-net
      - monitoring-net
    depends_on:
      - postgres

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_tool
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@domain.com
      PGADMIN_DEFAULT_PASSWORD: SecurePassword123!
    ports:
      - "8080:80"
    networks:
      - backend-net
      - frontend-net
    depends_on:
      - postgres

  # 2. Reverse Proxy (Yêu cầu 3)
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
      - backend-net

  # 3. Giám sát Prometheus + Grafana (Yêu cầu 4)
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:10.4.8
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=SecurePassword123!
    networks:
      - monitoring-net

  # 4. Log Loki + Promtail (Yêu cầu 5)
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring-net

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring-net